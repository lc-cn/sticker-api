openapi: 3.1.0
info:
  title: sticker-api
  version: 2.0.0
  description: |
    Compact sticker API for AI tools. Prefer short fields; list/search never includes mirror arrays,
    provenance, or license notices (see repo licenses/ and /docs). Image bytes via short /v1/asset URLs.
servers:
  - url: https://sticker.l2cl.link
paths:
  /v1/health:
    get:
      summary: Liveness flags
      responses:
        "200":
          description: "{ok,writes,renders,publicRenders,...}"
  /v1/assets:
    get:
      summary: Search/list (compact)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 64 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { enum: [relevance, uploaded] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: |
            `{n, next?, trunc?, items:[{id,url,title,tags?,cats?,w,h,mime,bytes,uploadedAt,rev,anim?}]}`
            `id` = 12-hex; `url` = `/v1/asset/<id>.<ext>` (302 to image). No `sources`.
    post:
      summary: Upload (auth)
      description: Multipart file+metadata; machine/admin only. See full admin docs.
      responses: { "201": { description: receipt } }
  /v1/assets/{id}:
    get:
      summary: Detail (compact, no sources)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "12-hex short id, or sha256:<64hex>" }
        - { name: view, in: query, schema: { enum: [full] }, description: "full = admin extras (rights/tone/text); omit for tools" }
      responses:
        "200":
          description: "{id,url,title,tags?,cats?,w,h,mime,bytes,anim?,rev,status,uploadedAt,sha} (+rights/… only if view=full)"
    patch:
      summary: Edit metadata (auth)
      responses: { "200": { description: receipt } }
    delete:
      summary: Tombstone (auth)
      responses: { "200": { description: receipt } }
  /v1/asset/{file}:
    get:
      summary: Short image URL → 302
      parameters:
        - { name: file, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{8,64}\\.(png|jpe?g|gif|webp)$" } }
      responses: { "302": { description: Location } }
  /v1/assets/{id}/content:
    get:
      summary: Legacy content 302 (prefer /v1/asset/...)
      responses: { "302": { description: Location } }
  /v1/categories:
    get:
      summary: Taxonomy with counts
      responses: { "200": { description: "{commit,categories:[{slug,label,count}]}" } }
  /v1/templates:
    get:
      summary: Renderable templates (compact)
      responses:
        "200":
          description: "{items:[{id,title,inputs:{texts,images},preview,tags?,params?}]}"
  /v1/templates/{id}/preview:
    get:
      summary: Template thumb → 302
      responses: { "302": { description: Location } }
  /v1/renders:
    post:
      summary: Render PNG (JSON or multipart)
      description: |
        Body `{template, texts?, params?, assetIds?, imageUrls?}` or multipart `request`+`image`.
        Response is raw `image/png` (not JSON). Auth token or anonymous when publicRenders enabled.
      responses: { "200": { description: image/png } }
  /v1/assets/batch:
    post:
      summary: Batch upload (auth)
      responses: { "201": { description: batch receipt } }
  /openapi.yaml:
    get:
      summary: This document
      responses: { "200": { description: text/yaml } }
  /tool.schema.json:
    get:
      summary: Tiny JSON tool schema for AI agents
      responses: { "200": { description: application/json } }
