openapi: 3.1.0
info:
  title: sticker-api (B)
  version: 1.0.0
  description: Stateless API over the A repo (sticker-assets). All reads pinned to one A commit; all writes are one atomic A commit.
servers:
  - url: https://sticker-api.example.vercel.app
components:
  securitySchemes:
    machine: { type: http, scheme: bearer, description: "Scoped machine token (only sha256 stored server-side)" }
    adminSession: { type: apiKey, in: cookie, name: __Host-sticker_session, description: "GitHub-login admin session; writes also need Origin + X-CSRF-Token" }
  parameters:
    AssetId: { name: id, in: path, required: true, schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, example: '"3"' } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            retryable: { type: boolean }
            details: { type: object }
    Asset:
      type: object
      description: A asset record (see vendor/sticker-assets/schemas/v1/asset.schema.json) plus uploadedAtLocal, contentUrl, sources
    Receipt:
      type: object
      properties:
        operationId: { type: string, pattern: "^op_[0-9a-f]{32}$" }
        commit: { type: string }
        status: { enum: [created, duplicate, updated, tombstoned, unchanged, replayed] }
        replayedType: { type: string }
        asset: { $ref: "#/components/schemas/Asset" }
  responses:
    Err: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
paths:
  /v1/health:
    get: { summary: Liveness + config warnings count, responses: { "200": { description: ok } } }
  /v1/assets:
    get:
      summary: Search (public)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 64 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { enum: [relevance, uploaded] }, description: "default: relevance with q, uploaded without" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: "{commit, items[], nextCursor}" }, "400": { $ref: "#/components/responses/Err" }, "503": { $ref: "#/components/responses/Err" } }
    post:
      summary: Upload (multipart file + metadata)
      security: [{ machine: [] }, { adminSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file: { type: string, format: binary, description: "PNG/JPEG/GIF ≤2 MiB, long edge ≤2048, ≤4 MP, ≤60 frames; privacy metadata stripped" }
                metadata: { type: string, description: "JSON: title, categories[], tags[], aliases[], language, tone, safety, text, source, firstSeenAt, rights{basis,licenseId,...}, shareable:true" }
      responses:
        "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Receipt" } } } }
        "200": { description: duplicate (existing asset, uploadedAt unchanged) or replayed }
        "400": { $ref: "#/components/responses/Err" }
        "401": { $ref: "#/components/responses/Err" }
        "403": { $ref: "#/components/responses/Err" }
        "409": { description: "idempotency_conflict | asset_tombstoned | publish_conflict (retryable)" }
        "413": { $ref: "#/components/responses/Err" }
        "415": { $ref: "#/components/responses/Err" }
        "422": { $ref: "#/components/responses/Err" }
        "428": { $ref: "#/components/responses/Err" }
        "429": { description: daily_budget_exceeded }
        "503": { description: "state_unverifiable | upstream_rate_limited (Retry-After) | writes_disabled" }
  /v1/assets/{id}:
    parameters: [{ $ref: "#/components/parameters/AssetId" }]
    get: { summary: Detail (public), responses: { "200": { description: "{commit, asset}" }, "404": { $ref: "#/components/responses/Err" }, "410": { $ref: "#/components/responses/Err" } } }
    patch:
      summary: Edit metadata (title/categories/tags/aliases/language/tone/safety/text/source)
      security: [{ machine: [] }, { adminSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses: { "200": { description: Receipt }, "412": { $ref: "#/components/responses/Err" }, "428": { $ref: "#/components/responses/Err" } }
    delete:
      summary: Tombstone (removes object from current tree; future re-upload rejected)
      security: [{ machine: [] }, { adminSession: [] }]
      parameters:
        - { name: reason, in: query, required: true, schema: { enum: [rights, privacy, quality, duplicate, policy, other] } }
        - { name: If-Match, in: header, required: false, schema: { type: string } }
      responses: { "200": { description: "Receipt (tombstoned | unchanged)" } }
  /v1/assets/{id}/review:
    parameters: [{ $ref: "#/components/parameters/AssetId" }]
    post:
      summary: "Archive ({status:'archived'}) or re-review rights ({rights:{...}}); restore → 501 in v1"
      security: [{ machine: [] }, { adminSession: [] }]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses: { "200": { description: Receipt }, "501": { $ref: "#/components/responses/Err" } }
  /v1/assets/{id}/content:
    parameters: [{ $ref: "#/components/parameters/AssetId" }, { name: source, in: query, schema: { type: string } }]
    get: { summary: "302 to mirror candidate or raw (pinned commit)", responses: { "302": { description: "Location + x-content-sha256 + x-asset-commit" }, "410": { $ref: "#/components/responses/Err" } } }
  /v1/templates:
    get: { summary: Active templates with renderable/unavailableReason, responses: { "200": { description: "{commit, templates[]}" } } }
  /v1/renders:
    post:
      summary: Render a light-v1 template to PNG
      security: [{ machine: [] }, { adminSession: [] }]
      requestBody:
        content:
          application/json: { schema: { type: object, required: [template], properties: { template: { type: string }, version: { type: integer }, texts: { type: array, items: { type: string } }, params: { type: object }, assetIds: { type: array, items: { type: string } } } } }
          multipart/form-data: { schema: { type: object, properties: { request: { type: string, description: same JSON }, image: { type: string, format: binary, description: "≤1 MiB each, ≤2 MiB total" } } } }
      responses: { "200": { description: image/png }, "404": { $ref: "#/components/responses/Err" }, "429": { $ref: "#/components/responses/Err" }, "503": { description: "template_unavailable | render_timeout | renders_disabled" } }
  /v1/operations/{op}:
    get:
      summary: Operation receipt (machines must send the original Idempotency-Key)
      security: [{ machine: [] }, { adminSession: [] }]
      parameters: [{ name: op, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{commit, event}" }, "403": { $ref: "#/components/responses/Err" } }
  /v1/collect-runs:
    post: { summary: Not in v1 (collection runs in A Actions), responses: { "501": { $ref: "#/components/responses/Err" } } }
  /v1/auth/github/start:
    get: { summary: Begin admin GitHub login (state + PKCE S256), responses: { "302": { description: to GitHub } } }
  /v1/auth/github/callback:
    get: { summary: Finish login; non-allowlisted numeric id → 403 and no session, responses: { "303": { description: to /v1/auth/session }, "400": { $ref: "#/components/responses/Err" }, "403": { $ref: "#/components/responses/Err" } } }
  /v1/auth/session:
    get: { summary: "{authenticated, admin, expiresAt, csrfToken}", responses: { "200": { description: ok } } }
  /v1/auth/logout:
    post: { summary: Clear session (CSRF-checked when a session exists), responses: { "204": { description: ok } } }
